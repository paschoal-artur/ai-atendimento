<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atendimento AI-First</title>
  <meta name="description" content="Diagnóstico do atendimento da Gocase e da GoBeauté e agente operacional que resolve conversas com ferramentas e políticas aplicadas em código.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h11' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    try {
      const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t;
      if (localStorage.getItem("nav") === "0") document.documentElement.classList.add("nav-collapsed");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h12"/></svg>
        </div>
        <div>
          <div class="brand-name">Atendimento AI-First</div>
          <div class="brand-sub">Gocase &amp; GoBeauté</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="llm-status" id="llm-status"><span class="dot"></span><span>Verificando agente</span></div>
        <div class="muted" id="data-stamp"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost icon-btn menu-btn" id="menu-btn" aria-label="Recolher menu" title="Mostrar ou recolher o menu" aria-controls="sidebar" aria-expanded="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-actions">
          <button class="btn btn-ghost icon-btn" id="theme-btn" aria-label="Alternar tema claro ou escuro">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1">
        <div class="stack">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </main>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
